services:
  - type: web
    name: quantlab-ai
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_PATH
        value: /data/quantlab.sqlite3
    disk:
      name: quantlab-data
      mountPath: /data
      sizeGB: 1
